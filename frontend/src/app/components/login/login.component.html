<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card glass-panel animate-fade-in">
        
        <div *ngIf="alertMsg" class="alert animate-alert" [ngClass]="'alert-' + alertType">{{ alertMsg }}</div>

        
        <div *ngIf="!showForgotPassword">
            <div class="text-center mb-4">
                <h1 class="system-main-title">VISITOR ROUTE<br>GUIDANCE SYSTEM</h1>
                <div class="icon-circle mb-3 pulse-primary" style="margin-top: 1.5rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h2 class="auth-title">Secure Login</h2>
                <p class="text-secondary-label">Enter email & password to authenticate.</p>
            </div>

            <form (ngSubmit)="onLogin()">
                <div class="form-group">
                    <label class="form-label">Email / Username</label>
                    <input type="email" class="form-control" [(ngModel)]="email" name="email" required placeholder="admin@company.com">
                </div>

                <div class="form-group">
                    <div class="form-group-flex">
                        <label class="form-label" style="margin-bottom: 0;">Password</label>
                        <a (click)="toggleForgot(true)" class="forgot-link">Forgot Password?</a>
                    </div>
                    <input type="password" class="form-control" [(ngModel)]="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-4" [disabled]="isLoading">
                    {{ isLoading ? 'Authenticating...' : 'LOGIN' }}
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="secure-access-footer">🔐 Secure Access</p>
                <p class="mt-2" style="font-size: 0.9rem;">New visitor? <a routerLink="/register" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Pre-register here</a></p>
            </div>
        </div>

        
        <div *ngIf="showForgotPassword">
            
            <div *ngIf="!showOtpStage">
                <div class="text-center mb-4">
                    <div class="icon-circle mb-3 pulse-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>
                    <h2 class="auth-title">Recover Password</h2>
                    <p class="text-secondary-label">Enter your email to receive an OTP.</p>
                </div>

                <form (ngSubmit)="onRequestOtp()">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" [(ngModel)]="forgotEmail" name="forgotEmail" required placeholder="yourname@gmail.com">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-4" [disabled]="isLoading">
                        {{ isLoading ? 'Sending OTP...' : 'Send Reset OTP' }}
                    </button>
                    <button type="button" class="btn btn-block mt-2 btn-back" (click)="toggleForgot(false)">
                        Back to Login
                    </button>
                </form>
            </div>

            
            <div *ngIf="showOtpStage">
                <div class="text-center mb-4">
                    <div class="icon-circle mb-3 pulse-success">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <h2 class="success-title">Enter Reset OTP</h2>
                    <p class="text-secondary-label">Enter OTP sent to {{ forgotEmail }} and set new password.</p>
                </div>

                <form (ngSubmit)="onResetPassword()">
                    <div class="form-group">
                        <label class="form-label">Verification OTP</label>
                        <input type="text" class="form-control otp-input" [(ngModel)]="forgotOtp" name="forgotOtp" required placeholder="123456" maxlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control" [(ngModel)]="newPassword" name="newPassword" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-4" [disabled]="isLoading">
                        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
                    </button>
                    <button type="button" class="btn btn-block mt-2 btn-back" (click)="toggleForgot(false)">
                        Cancel
                    </button>
                </form>
            </div>
        </div>
    </div>
  </div>
</body>
</html>
